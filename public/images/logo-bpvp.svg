<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%">
  <defs>
    <linearGradient id="bpvpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="100%" stop-color="#002266" />
    </linearGradient>
  </defs>

  <!-- Left Emblem (Kemnaker) -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="#ffffff" stroke="#003399" stroke-width="1.5" />
    <!-- Stylized 9 petals -->
    <g transform="translate(30, 30) scale(0.35)">
      <circle cx="0" cy="0" r="65" fill="#003399" />
      <circle cx="0" cy="0" r="50" fill="#ffffff" />
      <circle cx="0" cy="0" r="35" fill="#0284C7" />
      <circle cx="0" cy="-12" r="9" fill="#FBBF24" />
      <path d="M-15,15 C-15,0 15,0 15,15 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(80, 20)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#003399" letter-spacing="0.5">
      BPVP BANDA ACEH
    </text>
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#475569" letter-spacing="0.2">
      KEMENTERIAN KETENAGAKERJAAN RI
    </text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#94A3B8">
      Balai Pelatihan Vokasi &amp; Produktivitas
    </text>
  </g>
</svg>
